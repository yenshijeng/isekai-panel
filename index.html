<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>異世界迷宮・探索手帳</title>
<style>
:root{color-scheme:dark;--bg:#0b0a08;--bg2:#15110d;--bg3:#201a13;--line:#3a2f24;--tx:#e4d8c0;--mut:#8d8168;--amb:#e0b95a;--red:#c8503a;--grn:#7fbf7a;--teal:#6cc2c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
#top{padding:7px 12px;background:linear-gradient(180deg,#1a140e,#0d0a07);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
#top b{color:var(--amb);letter-spacing:.12em;white-space:nowrap}
.chips{flex:1;display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.chip{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:1px 8px;white-space:nowrap}
.chip.hp{color:var(--grn)}.chip.pt{color:var(--amb)}.chip.lo{color:var(--teal)}.chip.bad{color:var(--red)}
#tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:9px 2px;color:var(--mut);font-size:14px}
#tabs button.on{color:var(--amb);border-bottom-color:var(--amb)}
#tabs button.dot::after{content:"●";color:var(--red);font-size:9px;vertical-align:top;margin-left:2px}
#view{flex:1;overflow:auto;padding:10px 12px 36px}
#sbar:empty{display:none}#sbar{padding:8px 12px 10px;border-top:1px solid var(--line);background:var(--bg2)}
h3{margin:12px 0 7px;font-size:15px;color:var(--amb);font-weight:600}h3:first-child{margin-top:2px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:3px 0}.row span:first-child{color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
.btn{background:#1f1913;border:1px solid #4a3b2c;border-radius:8px;padding:8px 12px;min-height:40px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active{background:#4a3b2c}.btn:disabled{opacity:.38;cursor:default}
.btn.amb{background:#3a2f12;border-color:#8a7232;color:#ffe3a0}.btn.red{background:#3a1c18;border-color:#8a4a40;color:#ffc0b5}
.btn.wide{width:100%;margin-top:6px}.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
input,textarea,select{width:100%;background:#0c0a07;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
textarea{min-height:70px;resize:vertical}label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.bar{height:6px;background:#2a1a14;border-radius:3px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--grn)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;border:1px solid var(--line);color:var(--mut);margin-left:4px}
.tag.ok{color:var(--grn);border-color:#3e6a46}.tag.bad{color:var(--red);border-color:#7a3d35}.tag.fix{color:var(--amb);border-color:#7a6430}
.shop-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.shop-item:first-child{border-top:0}
.shop-item .nm{flex:1}.shop-item .nm small{display:block;color:var(--mut);font-size:12px}.price{color:var(--amb);white-space:nowrap;font-size:13px;margin-right:4px}
.log{font-size:13px;color:var(--mut);border-left:2px solid var(--line);padding-left:8px;margin:4px 0}
.ally{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.ally:first-child{border-top:0}
.av{width:42px;height:42px;border-radius:50%;flex:none;background:#2a2118 center/cover;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;border:1px solid #5a4a38;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
/* story */
.s-pic{margin:0 0 10px;border-radius:10px;overflow:hidden;border:1px solid var(--line);max-height:200px}.s-pic img{display:block;width:100%;height:200px;object-fit:cover;object-position:50% 35%}
.s-st{font-size:12px;color:#a89878;letter-spacing:.04em;margin:2px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.s-p{color:#cfc4ad;margin:0 0 .75em;line-height:1.8}
.s-d{color:#f4dfa0;margin:0 0 .75em;padding:2px 0 2px 10px;border-left:3px solid #b99a4a;background:rgba(224,185,90,.06);line-height:1.8}.s-d b{color:#ffe9b0}
.s-hr{height:1px;background:var(--line);margin:12px 0}
.s-opts{display:flex;flex-direction:column;gap:6px;margin:10px 0}.s-opts .btn{text-align:left}
.s-col{margin:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg2)}.s-col summary{padding:6px 10px;color:var(--mut);cursor:pointer;font-size:13px}.s-col div{padding:0 10px 8px;font-size:13px;color:#a89c84;white-space:pre-wrap}
.s-busy{color:var(--amb);font-size:13px;margin:6px 0}.s-ev{font-size:13px;color:var(--teal);border:1px solid #2a4a52;background:rgba(108,194,192,.07);border-radius:8px;padding:5px 10px;margin:6px 0}
.s-res{white-space:pre-wrap;font-size:13px;color:#a89c84}
.s-bar{display:flex;gap:8px;align-items:flex-end}.s-bar textarea{flex:1;min-height:56px;max-height:140px;resize:none}.s-bar .btn{min-height:56px;min-width:64px}
.locs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.locs .btn{min-height:34px;padding:4px 10px;font-size:13px}.locs .btn.cur{border-color:var(--amb);color:var(--amb)}
/* dungeon */
.vw{position:relative}
#dv{width:100%;aspect-ratio:8/5;display:block;background:#000;border:2px solid var(--line);border-radius:6px;image-rendering:pixelated}
#en{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:6px;pointer-events:none}
.ec{pointer-events:auto;width:128px;background:rgba(10,8,6,.72);border:1px solid var(--line);border-radius:8px;padding:4px;text-align:center;font-size:12px}.ec.boss{width:190px}
.ec.sel{border-color:var(--amb);box-shadow:0 0 0 2px rgba(224,185,90,.5);cursor:pointer}.ec.dead{opacity:.25;filter:grayscale(1)}
.ec img{width:100%;aspect-ratio:1;object-fit:contain;display:block}.ec img.px{image-rendering:pixelated}
.hb{height:5px;background:#3a1a16;border-radius:3px;overflow:hidden;margin-top:3px}.hb i{display:block;height:100%;background:var(--red)}.pc .hb i{background:var(--grn)}
.drow{display:flex;gap:8px;margin-top:8px;align-items:stretch}
#party{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
.pc{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12.5px}.pc b{font-weight:600;display:block}.pc small{color:var(--mut)}.pc.down{opacity:.45}.pc.def{border-color:var(--teal)}
#dm{width:132px;height:132px;background:#000;border:2px solid var(--line);border-radius:6px;image-rendering:pixelated;flex:none}
#dstat{margin:8px 0 0;font-size:13px;color:#b9ad92;display:flex;gap:12px;flex-wrap:wrap}#dstat .warn{color:var(--red)}
.pad,.cmd{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.pad .btn,.cmd .btn{font-size:15px;padding:12px 6px}.pad .wide,.cmd .wide{grid-column:1/4;margin-top:0}
#dlog{margin-top:8px;background:#100d0a;border:1px solid #2e251c;border-radius:6px;padding:7px 10px;font-size:13px;line-height:1.6;min-height:7em;max-height:11em;overflow:auto}
#dlog div{color:var(--mut)}#dlog div:first-child{color:#f0e3c4}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2a2218;border:1px solid #6a5838;padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90%;z-index:50}#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:40}#modal.on{display:flex}
#mbox{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;max-width:480px;width:100%;max-height:88vh;overflow:auto}
#mbox h3,#mbox h4{margin:0 0 8px;color:var(--amb)}#mbox .btn{display:block;width:100%;margin-top:6px;text-align:left;padding:10px 12px}#mbox .mut{margin:4px 0}
.dead{color:var(--red);font-weight:700}
.rw{display:inline-block;font-size:10px;line-height:15px;width:15px;text-align:center;border-radius:3px;margin-right:4px;color:#111;font-weight:700}.rw.f{background:#e0b95a}.rw.b{background:#7fb0d8}
.hb.mb{margin-top:2px;background:#16223a}.pc .hb.mb i,.hb.mb i{background:#4a8ad8}
.ec .st{font-size:11px;color:var(--amb);min-height:14px}.ec.sm{font-size:11px;padding:3px}
.btn.sm{padding:4px 9px;font-size:12px;min-height:0;width:auto;display:inline-block;margin:2px 4px 0 0}
#party{grid-template-columns:1fr 1fr}
</style>
</head>
<body>
<div id="app"><div id="top"><b>📒 探索手帳</b><div class="chips" id="chips"></div></div><nav id="tabs"></nav><main id="view"></main><div id="sbar"></div></div>
<div id="toast"></div><div id="modal"><div id="mbox"></div></div>
<script src="data.js"></script>
<script>
(function(){
'use strict';
var D=window.ISK_DATA,VER=D.VER,KEY='isk.save.v1';
var IMG_BASE='img/';   // 圖片資料夾，沒有圖會自動用內建圖形
var P=(window.parent&&window.parent!==window)?window.parent:null;
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function rf(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function djb(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h}

// ===== 資料 =====
var LOC=D.LOC,DG=D.DUNGEON,SHOPS=D.SHOPS;
var UPMAX=6;function upCost(k,n){return k==='a'?60*(n+1):50*(n+1)}
var ITEM=D.ITEM;
var SK=D.SKILL,SKO=D.HERO_SKILLS.map(function(x){return x[0]}),SKLV={};D.HERO_SKILLS.forEach(function(x){SKLV[x[0]]=x[1]});
function learned(){return SKO.filter(function(k){return G.lv>=SKLV[k]}).map(function(k){return SK[k].n})}
var BOND=['試用契約','正式契約','無期契約'];
var EN=D.EN,BOSS=D.BOSS;
function lvOf(f){return(f&&FL[f])?FL[f].lv:1}
function enemyStat(k,f){var s=1+D.SCALE*(lvOf(f)-1),b=BOSS[k],t,e;
 if(b){e=EN[b.base];var m=D.BOSS_MULT[b.uniq?'uniq':'normal'];t=Object.assign({},e);
  t.hp=Math.round(e.hp*s*m.hp*D.EN_HP);t.d=Math.round(e.d*s*m.d*D.EN_DMG);t.xp=Math.round(e.xp*s*m.xp);t.pts=Math.round(e.pts*s*m.pts);t.arm=Math.round((e.arm||0)*s);
  t.boss=1;t.uniq=b.uniq?1:0;if(b.img)t.img=b.img;if(b.shape)t.shape=b.shape;if(b.col)t.col=b.col;return t}
 e=EN[k];var elite=false;
 if(!e){var nm=Object.keys(EN).sort(function(a,b){return b.length-a.length}).filter(function(x){return k.indexOf(x)>=0})[0];e=EN[nm||'地痞'];elite=/變異|巨大|首領|精英/.test(k)}
 t=Object.assign({},e);t.hp=Math.round(e.hp*s*(elite?2:1)*D.EN_HP);t.d=Math.round(e.d*s*(elite?1.4:1)*D.EN_DMG);t.xp=Math.round(e.xp*s*(elite?2:1));t.pts=Math.round(e.pts*s*(elite?2:1));t.arm=Math.round((e.arm||0)*s);return t}
var FL=D.FL;
//#FL-END
var PAL=D.PAL;

//#GEN-START
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genFloor(f){
 var cfg=FL[f],c=cfg.size,n=2*c+1,r=rng(cfg.seed),g=[],i,j,t;
 for(i=0;i<n;i++){g.push([]);for(j=0;j<n;j++)g[i].push('#')}
 var st=[[1,1]];g[1][1]='.';
 while(st.length){var cur=st[st.length-1],x=cur[0],y=cur[1],ds=[[2,0],[-2,0],[0,2],[0,-2]],moved=false;
  for(i=3;i>0;i--){j=Math.floor(r()*(i+1));t=ds[i];ds[i]=ds[j];ds[j]=t}
  for(i=0;i<4;i++){var nx=x+ds[i][0],ny=y+ds[i][1];if(nx>0&&ny>0&&nx<n-1&&ny<n-1&&g[ny][nx]==='#'){g[y+ds[i][1]/2][x+ds[i][0]/2]='.';g[ny][nx]='.';st.push([nx,ny]);moved=true;break}}
  if(!moved)st.pop()}
 var want=Math.floor(c*c*0.14),done=0,tries=0;
 while(done<want&&tries<400){tries++;var wx,wy;if(r()<0.5){wx=2*(1+Math.floor(r()*(c-1)));wy=1+2*Math.floor(r()*c)}else{wx=1+2*Math.floor(r()*c);wy=2*(1+Math.floor(r()*(c-1)))}
  if(g[wy][wx]==='#'){g[wy][wx]='.';done++}}
 var D4=[[1,0],[-1,0],[0,1],[0,-1]],dist={'1,1':0},q=[[1,1]];
 while(q.length){var p=q.shift(),dd=dist[p[0]+','+p[1]];D4.forEach(function(d){var a=p[0]+d[0],b=p[1]+d[1],k=a+','+b;if(g[b]&&g[b][a]==='.'&&dist[k]==null){dist[k]=dd+1;q.push([a,b])}})}
 function deg(x,y){var k=0;D4.forEach(function(d){if(g[y+d[1]][x+d[0]]==='.')k++});return k}
 var cells=Object.keys(dist).map(function(k){var a=k.split(',');return{x:+a[0],y:+a[1],d:dist[k]}});
 var ends=cells.filter(function(o){return deg(o.x,o.y)===1&&o.d>2}).sort(function(a,b){return b.d-a.d});
 var used={'1,1':1};
 function mark(o){used[o.x+','+o.y]=1;return o}
 var boss=mark(ends.shift());
 for(i=ends.length-1;i>0;i--){j=Math.floor(r()*(i+1));t=ends[i];ends[i]=ends[j];ends[j]=t}
 function spot(){var o=ends.shift();if(o)return mark(o);var pool=cells.filter(function(c){return c.d>=5&&!used[c.x+','+c.y]&&deg(c.x,c.y)<=2});if(!pool.length)pool=cells.filter(function(c){return c.d>=3&&!used[c.x+','+c.y]});return mark(pool[Math.floor(r()*pool.length)])}
 var feats=[];if(cfg.boss)feats.push({id:'boss',type:'boss',x:boss.x,y:boss.y,foes:[cfg.boss]});
 var doorEnd=null;
 for(i=0;i<ends.length&&!doorEnd;i++){var e=ends[i],nb=null;D4.forEach(function(d){if(g[e.y+d[1]][e.x+d[0]]==='.')nb={x:e.x+d[0],y:e.y+d[1]}});
  if(nb&&deg(nb.x,nb.y)===2){doorEnd=e;ends.splice(i,1);g[nb.y][nb.x]='D';mark(e);used[nb.x+','+nb.y]=1}}
 if(doorEnd){var ka=spot();feats.push({id:'key',type:'key',x:ka.x,y:ka.y});feats.push({id:'cd',type:'chest',x:doorEnd.x,y:doorEnd.y,good:1})}
 var cap=D.encounterCap(cfg.lv),nest=null;
 for(i=0;i<ends.length&&!nest;i++){var e2=ends[i],nb2=null;D4.forEach(function(d){if(g[e2.y+d[1]][e2.x+d[0]]==='.')nb2={x:e2.x+d[0],y:e2.y+d[1]}});
  if(nb2&&deg(nb2.x,nb2.y)===2&&!used[nb2.x+','+nb2.y]){nest=e2;ends.splice(i,1);g[nb2.y][nb2.x]='H';mark(e2);used[nb2.x+','+nb2.y]=1}}
 if(nest){var nf=[],nn=Math.min(D.NEST.max,cap+D.NEST.extra);for(j=0;j<nn;j++)nf.push(cfg.mons[0]);feats.push({id:'nest',type:'nest',x:nest.x,y:nest.y,foes:nf})}
 var c1=spot();feats.push({id:'c1',type:'chest',x:c1.x,y:c1.y});
 var cand=cells.filter(function(c){return c.d>=4&&!used[c.x+','+c.y]});
 for(i=cand.length-1;i>0;i--){j=Math.floor(r()*(i+1));t=cand[i];cand[i]=cand[j];cand[j]=t}
 var nm=Math.min(cfg.nM,cand.length);
 for(i=0;i<nm;i++){var cnt=Math.min(cap,1+(r()<0.5?1:0)+(r()<0.25?1:0)+(r()<0.12?1:0)),fo=[],kind=r()<0.6?cfg.mons[0]:cfg.mons[Math.floor(r()*cfg.mons.length)],pk=!!EN[kind].pack;if(pk)cnt=cap;
  for(j=0;j<cnt;j++)fo.push((pk||r()<0.7)?kind:cfg.mons[Math.floor(r()*cfg.mons.length)]);
  if(EN[fo[0]].pack&&fo.every(function(k){return k===fo[0]}))while(fo.length<cap)fo.push(fo[0]);
  feats.push({id:'m'+i,type:'mon',x:cand[i].x,y:cand[i].y,foes:fo})}
 return{grid:g,feats:feats,boss:{x:boss.x,y:boss.y},n:n}}
//#GEN-END

// ===== 存檔 =====
var G;
function fresh(){return{v:1,started:false,name:'',lv:1,xp:0,hp:100,mp:20,row:'f',pts:60,items:{potion:2,fire:1,revive:0,stone:0,antidote:0},keys:0,ua:0,ud:0,loc:'inn',in:false,f:1,x:1,y:1,turn:0,seen:{},taken:{},slain:{},opened:{},guard:{},bound:[],steps:0,
 roster:[],party:[],notes:[],processed:[],battle:null,run:null,dead:false,idle:0,auto:true,test:false,tourDone:false,cleared:false}}
function load(){try{var t=localStorage.getItem(KEY);if(t){var o=JSON.parse(t);if(o&&o.v===1){if(o.mp==null){o.mp=20;o.row='f';o.roster=[];o.party=[];o.battle=null}return o}}}catch(e){}return null}
G=load()||fresh();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}arm()}
function tplOf(u){return u===G?D.HERO:D.COMP[u.name]}
function st(u){var t=tplOf(u),l=(u.lv||1)-1,o={};['hp','mp','str','vit','int','mnd','agi'].forEach(function(k){o[k]=Math.round(t.base[k]+t.grow[k]*l)});
 o.wpn=t.wpn+3*(u.ua|0);o.def=t.arm+(u.ud|0)+Math.floor(o.vit*.3);o.res=Math.floor(o.mnd*.3);return o}
function mhp(){return st(G).hp}
function mmp(){return st(G).mp}
function pdmg(){var s=st(G);return s.wpn+s.str}
function parmor(){return st(G).def}
function person(n){return G.roster.find(function(r){return r.name===n})}
function partyList(){return G.party.map(person).filter(Boolean)}
function members(){return[G].concat(partyList())}
function uname(u){return u===G?(G.name||'你'):u.name}
function rowOf(u){return u.row||tplOf(u).row}
function xpNeed(lv){return 30*lv}
function addComp(nm){var t=D.COMP[nm];if(!t)return null;var p=person(nm);if(!p){p={name:nm,lv:t.lv,xp:0,row:t.row,ua:0,ud:0,state:'ok',bond:0};var s=st(p);p.hp=s.hp;p.mp=s.mp;G.roster.push(p)}return p}
function fixRows(){['f','b'].forEach(function(r){var o=r==='f'?'b':'f',list=members().filter(function(u){return rowOf(u)===r});while(list.length>D.ROW_MAX)list.pop().row=o})}
function joinParty(nm){var p=addComp(nm);if(!p)return'沒有這位同伴';if(G.party.indexOf(nm)>=0)return'';if(G.party.length>=D.PARTY_MAX)return'隊伍已滿';G.party.push(nm);fixRows();return''}
function setRow(u,r){if(rowOf(u)===r)return'';if(members().filter(function(x){return rowOf(x)===r}).length>=D.ROW_MAX)return(r==='f'?'前衛':'後衛')+'已滿（最多 '+D.ROW_MAX+' 人）';u.row=r;return''}
function gainXp(xp){var ups=[];members().forEach(function(u){var b=st(u),l0=u.lv;u.xp=(u.xp||0)+xp;while(u.xp>=xpNeed(u.lv)){u.xp-=xpNeed(u.lv);u.lv++}if(u.lv>l0){var a=st(u);u.hp+=a.hp-b.hp;u.mp+=a.mp-b.mp;ups.push(uname(u)+' Lv.'+u.lv)}});return ups}
function note(t){G.notes.push(t);if(G.notes.length>8)G.notes.shift()}
function newRun(){return{kills:{},pts:0,xp:0,items:{},pages:[],boss:[],downs:{},lost:[],deep:1,steps0:G.steps,lv0:G.lv,rests:0,bound:[]}}
function R(){return G.run||(G.run=newRun())}

// ===== 迷宮狀態 =====
var FD={},CUR=null,BT=null,DL=[],DX=[0,1,0,-1],DY=[-1,0,1,0],DGMODE=null;
function fd(f){return FD[f]||(FD[f]=genFloor(f))}
function makeCur(f){var d=fd(f),g=d.grid.map(function(r){return r.slice()});
 for(var y=0;y<g.length;y++)for(var x=0;x<g.length;x++)if((g[y][x]==='D'||g[y][x]==='H')&&G.opened[f+':'+x+','+y])g[y][x]='.';
 if(!FL[f].boss||G.guard[f])g[d.boss.y][d.boss.x]='>';return g}
function say(s){DL.unshift(s);if(DL.length>40)DL.length=40;upd()}
function feAlive(f,ft){var k=f+':'+ft.id;if(ft.type==='mon')return !G.slain[k];if(ft.type==='boss')return !G.guard[f];return !G.taken[k]}
function featAt(x,y,types){return fd(G.f).feats.find(function(ft){return ft.x===x&&ft.y===y&&feAlive(G.f,ft)&&(!types||types.indexOf(ft.type)>=0)})}
function isDark(){return false}
var turn=0,px=1.5,py=1.5,ang=0,tx=1.5,ty=1.5,tang=0,flash=0;
function snapView(){px=tx=G.x+.5;py=ty=G.y+.5;turn=G.turn;ang=tang=-Math.PI/2+turn*Math.PI/2}
function reveal(){var k=G.f,s=G.seen[k]||(G.seen[k]={});for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++)s[(G.x+dx)+','+(G.y+dy)]=1}
function enterFloor(f,mode){G.f=f;CUR=makeCur(f);var d=fd(f);if(mode==='up'){G.x=d.boss.x;G.y=d.boss.y}else{G.x=1;G.y=1}
 var best=0;for(var k=0;k<4;k++){if(CUR[G.y+DY[k]]&&CUR[G.y+DY[k]][G.x+DX[k]]!=='#'){best=k;break}}
 G.turn=best;snapView();reveal();if(G.in&&G.run&&f>G.run.deep)G.run.deep=f;persist();upd()}
function dir(){return((turn%4)+4)%4}
function moving(){return Math.abs(tx-px)>.05||Math.abs(ty-py)>.05||Math.abs(tang-ang)>.05}
function tryMove(dx,dy){var nx=G.x+dx,ny=G.y+dy,c=CUR[ny]&&CUR[ny][nx];
 if(!c||c==='#'){say('前面是牆。');return}
 if(c==='D'){if(G.keys>0){G.keys--;G.opened[G.f+':'+nx+','+ny]=1;CUR[ny][nx]='.';say('鑰匙轉動，門開了。')}else say('門鎖住了，需要一把鑰匙。');persist();upd();return}
 if(c==='H'){G.opened[G.f+':'+nx+','+ny]=1;CUR[ny][nx]='.';say('你碰到的這面牆往下滑開了。後面是一個小房間——裡面擠滿了魔物。');persist();upd();return}
 var m=featAt(nx,ny,['mon','boss','nest']);if(m){if(m.type==='boss'){bossAsk(m);return}startBattle({type:m.type,id:m.id,foes:m.foes,ctx:'dg'});return}
 G.x=nx;G.y=ny;tx=G.x+.5;ty=G.y+.5;G.steps++;reveal();
 if(CUR[G.y][G.x]==='>'&&!G.guard[G.f]&&!FL[G.f].boss)bindFloor();
 var it=featAt(G.x,G.y,['key','chest']);if(it){G.taken[G.f+':'+it.id]=1;pickup(it)}
 persist();upd()}
function loot(good){var lv=lvOf(G.f),o=[],n=good?2:1;
 for(var i=0;i<n;i++){var r=Math.random();
  if(r<0.55||(good&&i===0)){var v=ri(15,35)*lv*(good?2:1);G.pts+=v;R().pts+=v;o.push(v+' 納爾')}
  else if(r<0.82){G.items.potion++;addItem('potion');o.push(ITEM.potion.n)}
  else{G.items.fire++;addItem('fire');o.push(ITEM.fire.n)}}
 return o.join('、')}
function pickup(it){
 if(it.type==='key'){G.keys++;say('撿到一把鑰匙。')}
 else if(it.type==='chest'){say('打開寶箱，得到：'+loot(it.good))}}
function nearMon(){return fd(G.f).feats.some(function(ft){returnisFoeFt(ft)&&feAlive(G.f,ft)&&Math.max(Math.abs(ft.x-G.x),Math.abs(ft.y-G.y))<=3})}
function act(a){if(!G.in||G.dead||BT||moving())return;var d=dir();
 switch(a){case'fwd':tryMove(DX[d],DY[d]);break;case'back':tryMove(-DX[d],-DY[d]);break;
 case'sl':tryMove(DX[(d+3)%4],DY[(d+3)%4]);break;case'sr':tryMove(DX[(d+1)%4],DY[(d+1)%4]);break;
 case'tl':G.turn--;turn=G.turn;tang=-Math.PI/2+turn*Math.PI/2;break;case'tr':G.turn++;turn=G.turn;tang=-Math.PI/2+turn*Math.PI/2;break}}
var PB=null;
function bossAsk(m){PB=m;modal('<div data-lock><h3>首領房前的等候室</h3><div class="mut">門後就是「'+esc(m.foes[0])+'」。首領房一次只進一隊，進去之後門會關上，打完之前出不來。</div>'+members().map(function(u){var s=st(u);return'<div class="row"><span>'+esc(uname(u))+'（'+(rowOf(u)==='f'?'前衛':'後衛')+'）</span><span>HP '+u.hp+'/'+s.hp+'｜MP '+u.mp+'/'+s.mp+'</span></div>'}).join('')+'<button class="btn amb" data-m="bossgo">推門進去</button><button class="btn" data-m="close">再準備一下</button></div>')}
function isFoeFt(ft){return ft.type==='mon'||ft.type==='boss'||ft.type==='nest'}
function onSpring(){return G.x===1&&G.y===1}
function onStairs(){return CUR&&CUR[G.y]&&CUR[G.y][G.x]==='>'}

function bindFloor(){G.guard[G.f]=true;if(G.bound.indexOf(G.f)<0)G.bound.push(G.f);R().bound.push(FL[G.f].n);say('這一層已經記錄，之後可以從入口直接來到下一層。')}
function healAll(){G.hp=mhp();G.mp=mmp();G.roster.forEach(function(a){var s=st(a);a.hp=s.hp;a.mp=s.mp;a.state='ok'})}
function itemName(k){return ITEM[k]?ITEM[k].n:k}
function summary(ending){var r=R(),L=['【探索紀錄】'],f0=r.from||G.f;
 L.push('迷宮：'+DG[FL[f0].dg].n+'｜路線：第'+FL[f0].lv+'層→最深到第'+FL[r.deep].lv+'層｜走了 '+(G.steps-r.steps0)+' 步｜在入口休息 '+r.rests+' 次');
 var k=Object.keys(r.kills).map(function(n){return n+'×'+r.kills[n]}).join('、');L.push('擊倒：'+(k||'無'));
 if(r.boss.length)L.push('首領：'+r.boss.join('、')+'（已擊敗）');
 if(r.bound.length)L.push('新打通的樓層：'+r.bound.join('、'));
 var it=[];if(r.pts)it.push('納爾 +'+r.pts);Object.keys(r.items).forEach(function(n){it.push(itemName(n)+'×'+r.items[n])});if(r.xp)it.push('經驗 +'+r.xp);if(G.lv>r.lv0)it.push('升到 Lv.'+G.lv);
 L.push('收穫：'+(it.join('、')||'無'));
 if(r.fee)L.push('入場費：'+r.fee+' 納爾');
 var team=G.party.map(function(n){return n+(r.downs[n]?'（途中倒地過）':'（正常）')}).join('、');
 if(team)L.push('同伴：'+team);if(r.nest)L.push('清掉了一間魔物房。');
 if(r.stone)L.push('離開方式：用掉一顆歸途石，直接回到地面。');
 L.push('離開時：生命 '+Math.max(0,G.hp)+'/'+mhp()+'。'+(ending||'從入口小房間的黑牆回到地面，已經休息回復。'));
 return L.join('\n')}
function sendOut(text){ST.evs=[];ST.res='';ST.go=null;ST.busy=true;TAB='story';if(P){post({t:'fill',text:text,send:G.auto,keep:true});if(!G.auto)ST.busy=false}else{toast('（測試模式）'+text.split('\n')[0]);ST.busy=false}render()}
function exitDungeon(){var txt=summary();G.loc=DG[FL[G.f].dg].gate;G.in=false;G.idle=0;healAll();G.run=null;BT=null;persist();DGMODE=null;sendOut(txt)}
function dgFloors(dg){var o=[];for(var f=1;f<FL.length;f++)if(FL[f].dg===dg)o.push(f);return o}
function isLast(f){return !FL[f+1]||FL[f+1].dg!==FL[f].dg}
function gateDg(){var hit=null;Object.keys(DG).forEach(function(k){if(DG[k].gate===G.loc)hit=k});return hit}
function entryFee(dg){return DG[dg].fee*(1+G.party.length)}
function startFloors(dg){var fs=dgFloors(dg),o=[fs[0]];for(var i=1;i<fs.length;i++)if(G.bound.indexOf(fs[i-1])>=0)o.push(fs[i]);return o}
function enterDungeon(f){if(G.dead)return;f=+f;var dg=FL[f]&&FL[f].dg;if(!dg||startFloors(dg).indexOf(f)<0)return;
 var fee=entryFee(dg);if(G.pts<fee){toast('入場費不足（需要 '+fee+' 納爾）');return}G.pts-=fee;
 G.in=true;G.run=newRun();G.run.deep=f;G.run.from=f;G.run.fee=fee;G.f=f;enterFloor(f,'start');DL=[];say('你們穿過黑牆，來到'+FL[f].n+'的入口小房間。');TAB='dg';DGMODE=null;persist();render()}

function springMenu(){var h='<h3>⬛ 入口小房間（'+FL[G.f].n+'）</h3><div class="mut">'+(G.guard[G.f]?'這一層的首領已經打倒，通往下一層的路開著。':'這一層的首領還在首領房裡。')+'</div>';
 h+='<button class="btn" data-m="rest">休息：全隊回復，這層的魔物會重新湧出</button>';
 h+='<button class="btn amb" data-m="surface">穿過黑牆回地面</button>';
 h+='<button class="btn" data-m="close">關閉</button>';modal(h)}

$('modal').addEventListener('click',function(e){if(e.target.id==='modal'&&!$('mbox').querySelector('[data-lock]'))closeModal()});
document.addEventListener('click',function(e){var b=e.target.closest('[data-m]');if(!b)return;var m=b.dataset.m,a=b.dataset.a;
 if(m==='close'){closeModal();return}
 if(m==='rest'){healAll();R().rests++;Object.keys(G.slain).forEach(function(k){if(k.indexOf(G.f+':')===0)delete G.slain[k]});say('在入口小房間休息。傷勢恢復了，但迷宮也趁這段時間重新湧出了魔物。');closeModal();persist();upd();return}
 if(m==='surface'){modal('<div data-lock><h3>回地面？</h3><div class="mut">會把這趟的探索紀錄一次送給 AI，由它接寫回到地面的場面。回到地面後生命會回滿。</div><button class="btn amb" data-m="surface2">穿過黑牆回地面</button><button class="btn" data-m="close">再逛逛</button></div>');return}
 if(m==='surface2'){closeModal();exitDungeon();return}
 if(m==='descend'){closeModal();if(isLast(G.f)){modal('<h3>最深處</h3><div class="mut">'+(FL[G.f].dg==='po'?'再往下的樓層還沒有開放。':'這裡已經是迷宮的最深處。')+'</div><button class="btn" data-m="close">關閉</button>');return}
  enterFloor(G.f+1,'start');say('你們穿過黑牆，來到'+FL[G.f].n+'。');return}
 if(m==='bossgo'){closeModal();if(PB)startBattle({type:'boss',id:PB.id,foes:PB.foes,ctx:'dg'});return}
 if(m==='sk'){closeModal();cmd(a);return}if(m==='skh'){closeModal();healPlayer(+a);return}if(m==='it'){useItem(a);return}if(m==='itt'){useItemOn(a,+b.dataset.t);return}
 if(m==='buy'){buy(a);return}if(m==='upg'){upgrade(a);return}
 if(m==='enter'){closeModal();enterDungeon(a);return}
 if(m==='stone'){modal('<div data-lock><h3>使用歸途石？</h3><div class="mut">會消耗 1 顆歸途石，立刻回地面，並把這趟的探索紀錄送給 AI。</div><button class="btn amb" data-m="stone2">使用</button><button class="btn" data-m="close">不用</button></div>');return}
 if(m==='stone2'){closeModal();if(!(G.items.stone>0))return;G.items.stone--;R().stone=1;exitDungeon();return}
});

// ===== 戰鬥 =====
function startBattle(cfg){if(G.battle&&G.battle.pending&&BT)return;
 G.battle={pending:true,type:cfg.type,id:cfg.id||null,foes:cfg.foes.slice(),ctx:cfg.ctx,where:cfg.where||'',why:cfg.why||''};initBT();persist()}
function mkUnit(u,i){var s=st(u),t=tplOf(u),me=u===G;
 return{id:me?'P':'A'+i,ref:u,name:uname(u),side:me?'p':'a',job:t.job,row:rowOf(u),hp:Math.max(0,Math.min(u.hp,s.hp)),max:s.hp,mp:Math.max(0,Math.min(u.mp|0,s.mp)),mmp:s.mp,
  str:s.str,int:s.int,mnd:s.mnd,agi:s.agi,wpn:s.wpn,armor:s.def,res:s.res,ranged:!!t.ranged,ai:t.ai||[],lv:u.lv,fx:{}}}
function initBT(){var c=G.battle;
 var party=members().map(mkUnit);if(party[0].hp<=0)party[0].hp=1;
 var foes=c.foes.map(function(k,i){var t=enemyStat(k,c.ctx==='dg'?G.f:0);return{id:'E'+i,name:k,side:'e',hp:t.hp,max:t.hp,dmg:t.d,armor:t.arm||0,res:0,agi:t.agi||7,boss:!!t.boss,uniq:!!t.uniq,shape:t.shape,col:t.col,img:t.img,weak:t.weak||[],tr:t,fx:{},n:0}});
 BT={cfg:c,party:party,foes:foes,round:1,mode:'cmd',pending:null,log:['戰鬥開始！'],over:null,buff:null};
 if(c.type==='boss')say('你們踏進首領房——身後的門關上了。'+c.foes[0]+'轉了過來。');
 if(c.type==='nest')say('小房間裡的魔物一起轉了過來。');
 TAB='dg';DGMODE=null;post({t:'want',open:true});render()}
function Pl(){return BT.party[0]}
function alive(u){return u.hp>0}
function able(u){return u.hp>0&&!u.fx.stone}
function liveF(){return BT.foes.filter(alive)}
function liveP(){return BT.party.filter(alive)}
function frontP(){var a=liveP(),f=a.filter(function(u){return u.row==='f'});return f.length?f:a}
function nm(u){return u.side==='p'?'你':u.name}
function blog(s){BT.log.unshift(s);if(BT.log.length>60)BT.log.length=60;upd()}
function fxIcons(u){return Object.keys(u.fx||{}).map(function(k){return D.FX[k].icon}).join('')}
function addFx(tg,k){var F=D.FX[k];if(tg.hp<=0||tg.fx[k])return false;
 if(tg.side==='e'&&tg.uniq&&D.BOSS_IMMUNE.indexOf(k)>=0){blog(nm(tg)+' 不受'+F.n+'影響');return false}
 var dur=(tg.side==='e'&&F.foeDur)?F.foeDur:(F.dur||99);if(dur<90&&tg.acted===BT.round)dur++;
 tg.fx[k]=dur;if(k==='stone'||k==='sleep'||k==='bind'){tg.chant=null;tg.charging=false}blog(nm(tg)+' 陷入'+F.n+'！');return true}
function tryFx(tg,fx){if(fx&&Math.random()<fx.p)addFx(tg,fx.k)}
function applyDmg(a,d,v,tag,weak){d.hp-=v;blog(nm(a)+tag+nm(d)+'，造成 '+v+' 傷害'+(weak?'（弱點！）':''));
 if(d.fx.sleep&&d.hp>0){delete d.fx.sleep;blog(nm(d)+' 被打醒了')}
 if(d.hp<=0){d.hp=0;d.fx={};d.chant=null;d.charging=false;blog(nm(d)+(d.side==='e'?' 倒下了':' 倒地了！'))}
 if(d.side!=='e')flash=1;return v}
function dealPhys(a,d,mult,tag,opt){opt=opt||{};var atk=a.side==='e'?a.dmg:(a.wpn+a.str),m=mult||1;
 if(a.side!=='e'){if(BT.buff)m*=1.25;if(a.row==='b'&&!a.ranged)m*=D.BACK_MELEE}
 if(d.fx.expose)m*=1+D.FX.expose.bonus;
 var v=atk*m*rf(.85,1.15);if(d.def)v*=.5;v=Math.max(1,Math.round(v-(opt.pierce?0:d.armor)));
 return applyDmg(a,d,v,tag||' 攻擊 ')}
function dealMagic(a,d,base,elem,tag,mult){var pw=a.side==='e'?a.dmg*(mult||1):(base+a.int*D.MAGIC_INT),m=1,weak=false;
 if(a.side!=='e'&&BT.buff)m*=1.25;if(elem&&d.weak&&d.weak.indexOf(elem)>=0){m*=D.WEAK;weak=true}if(d.fx.expose)m*=1+D.FX.expose.bonus;
 var v=pw*m*rf(.9,1.1);if(d.def)v*=.5;v=Math.max(1,Math.round(v-(d.res||0)));
 return applyDmg(a,d,v,tag,weak)}
function healU(tg,v,by,tag){var b=tg.hp;tg.hp=Math.min(tg.max,tg.hp+Math.round(v));blog(nm(by)+tag+(tg===by?'自己':nm(tg))+'，回復 '+(tg.hp-b)+' 生命')}
function lowest(th){return liveP().filter(function(p){return p.hp<p.max*th}).sort(function(a,b){return a.hp/a.max-b.hp/b.max})[0]}
function afflicted(cures){return BT.party.filter(function(p){return p.hp>0&&cures.some(function(k){return p.fx[k]})})[0]}
function strongest(){return liveF().slice().sort(function(a,b){return b.hp-a.hp})[0]}
function pickFoe(pref){var fs=liveF();if(!fs.length)return null;if(pref&&pref.side==='e'&&pref.hp>0)return pref;return fs.slice().sort(function(a,b){return a.hp-b.hp})[0]}
function useSkill(u,id,tg){var s=SK[id];if(!s||(s.mp&&u.mp<s.mp))return false;
 switch(s.kind){
 case'phys':{tg=pickFoe(tg);if(!tg)return false;u.mp-=s.mp;for(var h=0;h<(s.hits||1);h++){var t2=tg.hp>0?tg:liveF()[0];if(!t2)break;dealPhys(u,t2,s.mult,' 用'+s.n+'打向 ',{pierce:s.pierce});if(s.fx&&t2.hp>0)tryFx(t2,s.fx)}return true}
 case'magic':{tg=pickFoe(tg);if(!tg)return false;u.mp-=s.mp;var el=s.elem;if(s.elems)el=s.elems.filter(function(e){return tg.weak.indexOf(e)>=0})[0]||s.elems[0];dealMagic(u,tg,s.base,el,' 的'+((s.names&&s.names[el])||s.n)+'擊中 ');return true}
 case'magicall':{if(!liveF().length)return false;u.mp-=s.mp;blog(nm(u)+' 放出'+s.n+'！');liveF().forEach(function(f){dealMagic(u,f,s.base,s.elem,' 的'+s.n+'燒向 ')});return true}
 case'heal':{tg=(tg&&tg.side!=='e'&&tg.hp>0)?tg:lowest(.999);if(!tg)return false;u.mp-=s.mp;healU(tg,s.pct?tg.max*s.pct:s.base+u.mnd*s.scale,u,' 用'+s.n+'治療 ');return true}
 case'healall':{u.mp-=s.mp;blog(nm(u)+' 施展'+s.n);liveP().forEach(function(p){healU(p,s.base+u.mnd*s.scale,u,' 治療 ')});return true}
 case'cure':{tg=tg||afflicted(s.cures);if(!tg)return false;u.mp-=s.mp;s.cures.forEach(function(k){delete tg.fx[k]});blog(nm(u)+' 用'+s.n+'解除了 '+(tg===u?'自己':nm(tg))+' 的異常狀態');return true}
 case'taunt':{u.mp-=s.mp;u.fx.taunt=D.FX.taunt.dur;blog(nm(u)+' 大喝一聲，把敵人的注意力拉了過來');return true}
